name: Regenerate Static HTML from JSON

on:
  push:
    paths:
      - 'data/**'
      - 'js/render.js'
      - 'tools/build.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate static HTML, sitemap.xml and robots.txt
        run: |
          if [ -f "tools/build.js" ]; then
            node tools/build.js
          elif [ -f "smart-start/tools/build.js" ]; then
            cd smart-start && node tools/build.js
          fi

      - name: Commit regenerated static files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: regenerate static HTML and sitemap from JSON"
          git push

