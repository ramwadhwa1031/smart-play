name: Sync Live Instagram Reels & Regenerate Static HTML

on:
  push:
    paths:
      - 'data/**'
      - 'js/render.js'
      - 'tools/build.js'
      - 'tools/sync-instagram.js'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync latest Instagram Reels, Google Reviews & regenerate static HTML
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          GOOGLE_REVIEWS_FEED_URL: ${{ secrets.GOOGLE_REVIEWS_FEED_URL }}
        run: |
          if [ -f "tools/build.js" ]; then
            node tools/sync-instagram.js || true
            node tools/sync-google-reviews.js || true
            node tools/build.js
          elif [ -f "smart-start/tools/build.js" ]; then
            cd smart-start
            node tools/sync-instagram.js || true
            node tools/sync-google-reviews.js || true
            node tools/build.js
          fi

      - name: Commit regenerated static files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync Instagram Reels and regenerate static HTML"
          git push
